<section class="panel">
  <h2><span class="material-symbols-outlined">factory</span>Gestion des Marques d'outils</h2>
  <p>Onglet reserve aux administrateurs.</p>

  <form class="form" (ngSubmit)="addManufacturer()">
    <label>
      <span class="material-symbols-outlined">badge</span>
      <input name="nom" [(ngModel)]="nom" placeholder="Nom" required />
    </label>
    <label>
      <span class="material-symbols-outlined">public</span>
      <input name="pays" [(ngModel)]="pays" placeholder="Pays" />
    </label>
    <label>
      <span class="material-symbols-outlined">language</span>
      <input name="site_web" [(ngModel)]="site_web" placeholder="Site web" />
    </label>
    <label>
      <span class="material-symbols-outlined">image</span>
      <input name="icon" [(ngModel)]="icon" placeholder="Icon (ex: bosch)" />
    </label>
    <button type="submit">
      <span class="material-symbols-outlined">add_circle</span>
      Ajouter
    </button>
  </form>

  <div class="cards-list">
    @for (m of manufacturers(); track m.id) {
      <article class="entity-card clickable" (click)="startEditManufacturer(m)">
        <div class="entity-head">
          <strong>{{ m.nom }}</strong>
          <span class="material-symbols-outlined">chevron_right</span>
        </div>
        <p class="entity-sub">Pays: {{ m.pays || '-' }}</p>
        <span class="chip">{{ m.icon || '-' }}</span>
      </article>
    }
  </div>
</section>

@if (editingManufacturer(); as current) {
  <div class="modal-overlay" (click)="cancelEditManufacturer()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <form class="form" (ngSubmit)="saveManufacturerEdit()">
        <div class="modal-header">
          <h3>Modifier une marque</h3>
          <div class="actions">
            <button type="button" class="icon-btn ghost" title="Fermer" aria-label="Fermer" (click)="cancelEditManufacturer()">
              <span class="material-symbols-outlined">close</span>
            </button>
            <button type="button" class="icon-btn secondary" title="Annuler l'edition" aria-label="Annuler l'edition" (click)="cancelEditManufacturer()">
              <span class="material-symbols-outlined">undo</span>
            </button>
            <button type="submit" class="icon-btn" title="Sauvegarder l'edition" aria-label="Sauvegarder l'edition">
              <span class="material-symbols-outlined">check</span>
            </button>
            <button type="button" class="icon-btn danger" title="Supprimer la marque" aria-label="Supprimer la marque" (click)="deleteEditingManufacturer()">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
        <label>
          <span class="material-symbols-outlined">badge</span>
          <input name="edit_nom" [(ngModel)]="editNom" placeholder="Nom" required />
        </label>
        <label>
          <span class="material-symbols-outlined">public</span>
          <input name="edit_pays" [(ngModel)]="editPays" placeholder="Pays" />
        </label>
        <label>
          <span class="material-symbols-outlined">language</span>
          <input name="edit_site_web" [(ngModel)]="editSiteWeb" placeholder="Site web" />
        </label>
        <label>
          <span class="material-symbols-outlined">image</span>
          <input name="edit_icon" [(ngModel)]="editIcon" placeholder="Icon (ex: bosch)" />
        </label>
        <p class="editing-hint">Edition de: <strong>{{ current.nom }}</strong></p>
      </form>
    </div>
  </div>
}
