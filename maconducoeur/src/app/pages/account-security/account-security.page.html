<section class="panel">
  <h2><span class="material-symbols-outlined">security</span>Securite</h2>
  <p>Mettre a jour le mot de passe du compte.</p>

  <form class="form" (ngSubmit)="updatePassword()">
    <input name="currentPassword" [(ngModel)]="currentPassword" type="password" placeholder="Mot de passe actuel" required />
    <input name="newPassword" [(ngModel)]="newPassword" type="password" placeholder="Nouveau mot de passe" required />
    <input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" placeholder="Confirmer le nouveau mot de passe" required />
    <button type="submit">Mettre a jour</button>
  </form>
</section>
